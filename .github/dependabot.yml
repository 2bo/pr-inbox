version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates wait a week after a release, so a compromised release is likely pulled first.
    # Security updates are not delayed
    cooldown:
      default-days: 7
    groups:
      # typescript gets PRs of its own: CI cannot type-check, so a person merges those
      dev-dependencies:
        patterns: ["*"]
        exclude-patterns: ["typescript"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
