# Keeps auto-merge on a Dependabot PR only while CodeRabbit's latest review approves the current head.
# GitHub merges it only with the required CI check passed and an approval of the head (ruleset on main),
# so a review dismissed after this run still blocks the merge.
# Major updates and typescript updates are left for a person: the model's approval is never the only gate,
# and CI does not type-check (the declarations come only from a signed-in session), so pnpm run check runs locally.
#
# Each run decides from the PR as it is now, not from the event that started it,
# so runs that arrive late or out of order still leave the right state
name: Dependabot auto-merge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

# Workflows started by Dependabot get a read-only token unless the permissions key raises it
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          # dependency-names is comma-separated, such as "typescript, @biomejs/biome"
          manual=false
          [ "$UPDATE_TYPE" = version-update:semver-major ] && manual=true
          printf '%s\n' "$DEPENDENCIES" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -qx typescript && manual=true
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          # CodeRabbit's latest review; a push dismisses older approvals (ruleset on main)
          latest=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "coderabbitai[bot]") | "\(.state) \(.commit_id)"' | tail -n 1)
          enabled=$(gh api "repos/$REPO/pulls/$PR" --jq '.auto_merge != null')
          if [ "$latest" = "APPROVED $head" ] && [ "$manual" = false ]; then
            echo "CodeRabbit approved $head: auto-merge on"
            gh pr merge --auto --squash --match-head-commit "$head" "$PR" --repo "$REPO"
          elif [ "$enabled" = true ]; then
            echo "Head $head is not approved for auto-merge (latest: ${latest:-none}, manual: $manual): auto-merge off"
            gh pr merge --disable-auto "$PR" --repo "$REPO"
          else
            echo "Head $head is not approved for auto-merge (latest: ${latest:-none}, manual: $manual): nothing to do"
          fi
