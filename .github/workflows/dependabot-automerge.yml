# Turns on auto-merge for a Dependabot PR once CodeRabbit approves it.
# GitHub merges it only after the required CI check passes (ruleset on main).
# Major updates are left for a person: the model's approval is never the only gate.
name: Dependabot auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Approved for the commit CodeRabbit reviewed; refuse if the head moved since
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEWED: ${{ github.event.review.commit_id }}
        run: gh pr merge --auto --squash --match-head-commit "$REVIEWED" "$PR_URL"
